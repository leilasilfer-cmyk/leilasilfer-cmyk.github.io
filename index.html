<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Code Labs</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1f;
    --muted: #5c5c68;
    --line: #e4e4ea;
    --accent: #6b4de6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131318;
      --fg: #f0f0f4;
      --muted: #a0a0ad;
      --line: #2c2c36;
      --accent: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin: 0 0 .35rem; letter-spacing: -.02em; }
  .tag { color: var(--muted); margin: 0 0 2.5rem; }
  h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 2.5rem 0 .75rem; font-weight: 600;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: .85rem 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>Gold Code Labs</h1>
  <p class="tag">Jogos e aplicativos para iOS e Android.</p>

  <h2>Apps</h2>
  <ul>
    <li><a href="https://apps.apple.com/app/id6794945104">Memory Squares — Brain Game</a></li>
    <li>Valentina Block 3D</li>
    <li>A Voz do Senhor</li>
    <li>Planner Vida Próspera</li>
  </ul>

  <h2>Suporte</h2>
  <ul>
    <li><a href="support.html">Central de suporte e perguntas frequentes</a></li>
    <li><a href="mailto:leilasilfer@gmail.com">leilasilfer@gmail.com</a></li>
  </ul>

  <footer>© 2026 Gold Code Labs</footer>
</main>
</body>
</html>
